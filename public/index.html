<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frojoltec Backend API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 500px;
      text-align: center;
    }
    h1 {
      color: #38bdf8;
      margin-top: 0;
    }
    a {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.6rem 1.2rem;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 600;
    }
    a:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Frojoltec Backend</h1>
    <p>API Serverless en Node.js, Express, TypeScript y Prisma ORM con Vercel Postgres.</p>
    <div>
      <a href="/api/health" target="_blank">Health Check</a>
      <a href="/api/users" target="_blank">API Users</a>
    </div>
  </div>
</body>
</html>
